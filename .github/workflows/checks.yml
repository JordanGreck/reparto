name: Comprobaciones

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comprobaciones-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Pruebas y compilacion
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Obtener el codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Instalar las dependencias del archivo de bloqueo
        run: npm ci
      - name: Ejecutar las pruebas
        run: npm test
      - name: Compilar la aplicacion
        run: npm run build
      - name: Comprobar dependencias de produccion
        run: npm audit --omit=dev --audit-level=high
