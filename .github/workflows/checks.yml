name: Comprobaciones

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comprobaciones-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Pruebas y compilacion
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Obtener el codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar las dependencias del archivo de bloqueo
        run: npm ci
      - name: Ejecutar las pruebas
        run: npm test
      - name: Compilar la aplicacion
        run: npm run build
      - name: Comprobar dependencias de produccion
        run: npm audit --omit=dev --audit-level=high
