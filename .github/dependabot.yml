version: 2
updates:
  # Las actualizaciones npm de seguridad se habilitan en GitHub.
  # El cero desactiva propuestas rutinarias de version, no las de seguridad.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
